<!-- Add these meta tags to your website HTML head section -->
<!-- File: https://gatewayreports.in/send/app.html or any page -->

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Open in Gateway Messenger</title>
    
    <!-- Universal Link for iOS -->
    <meta property="al:ios:url" content="gateway://send/app" />
    <meta property="al:ios:app_store_id" content="YOUR_IOS_APP_ID" />
    <meta property="al:ios:app_name" content="Gateway Messenger" />
    
    <!-- Android App Link -->
    <meta property="al:android:url" content="gateway://send/app" />
    <meta property="al:android:package" content="com.company.gateway" />
    <meta property="al:android:app_name" content="Gateway Messenger" />
    
    <!-- Twitter Card for better sharing -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:app:name:googleplay" content="Gateway Messenger" />
    <meta name="twitter:app:id:googleplay" content="com.company.gateway" />
    <meta name="twitter:app:url:googleplay" content="gateway://send/app" />
    
    <script>
        // Auto-redirect for Firefox and other browsers
        window.onload = function() {
            // Get message from URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const message = urlParams.get('message');
            
            if (message) {
                // Try custom scheme first (works in Firefox)
                const customUrl = 'gateway://send/app?message=' + encodeURIComponent(message);
                window.location.href = customUrl;
                
                // Fallback to Play Store after 2 seconds if app not installed
                setTimeout(function() {
                    window.location.href = 'https://play.google.com/store/apps/details?id=com.company.gateway';
                }, 2000);
            }
        };
    </script>
</head>
<body>
    <h1>Opening Gateway Messenger...</h1>
    <p>If the app doesn't open automatically:</p>
    <button onclick="openApp()">Open App</button>
    <a href="https://play.google.com/store/apps/details?id=com.company.gateway">Download from Play Store</a>
    
    <script>
        function openApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const message = urlParams.get('message');
            
            if (message) {
                // Try custom scheme
                window.location.href = 'gateway://send/app?message=' + encodeURIComponent(message);
            }
        }
    </script>
</body>
</html>
